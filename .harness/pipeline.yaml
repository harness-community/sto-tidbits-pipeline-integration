pipeline:
  # EDIT: unique id for this pipeline inside the project. Letters, numbers, and underscores. No spaces.
  identifier: Scan_Pipeline_Multiple_Scanners_For_Existing_CI_Process
  # EDIT: name shown in the Pipelines list. Spaces are fine here.
  name: Scan Pipeline Multiple Scanners For Existing CI Process
  # EDIT: your Harness project identifier (Project Settings)
  projectIdentifier: <+input>
  # EDIT: your Harness organization identifier
  orgIdentifier: <+input>
  tags: {}
  properties:
    ci:
      codebase:
        # EDIT: uncomment and set the id of your code repo connector.
        # Use Connect through Harness Platform when this stage runs on Harness Cloud.
        # connectorRef: YOUR_GIT_CONNECTOR
        # INPUT at Run: repository name on that connector. <+input> prompts every run.
        repoName: <+input>
        # INPUT at Run: branch or tag to clone. <+input> prompts every run.
        # For a first scan, enter the root branch (main or master) so you can set it as the baseline later.
        build: <+input>
        # Leave empty to clone the full repository. Add paths here only for a sparse checkout.
        sparseCheckout: []
  stages:
    - stage:
        # EDIT: stage display name.
        name: Build and Scan
        # EDIT: unique stage id. Letters, numbers, and underscores. No spaces.
        identifier: Build_and_Scan
        description: ""
        type: CI
        spec:
          # Keep true so the stage clones the codebase before the steps run.
          # Gitleaks scans that checkout (default workspace /harness).
          cloneCodebase: true
          platform:
            # EDIT only if your build infrastructure is not Linux AMD64.
            os: Linux
            arch: Amd64
          runtime:
            # Cloud = Harness Cloud. Change type if you use a Kubernetes build infrastructure instead.
            type: Cloud
            spec: {}
          execution:
            steps:
              # Existing CI work. The scan step below is added after this. Do not delete your real steps.
              - step:
                  type: Run
                  # EDIT: step display name.
                  name: Install Dependency
                  # EDIT: unique step id. Letters, numbers, and underscores. No spaces.
                  identifier: Install_Dependency
                  spec:
                    shell: Sh
                    # EDIT: replace this echo with the install, test, or build command this pipeline already runs.
                    command: echo "Installing Dependency"
              - step:
                  type: Gitleaks
                  # EDIT: step display name.
                  name: Gitleaks
                  # EDIT: unique step id. Letters, numbers, and underscores. No spaces.
                  identifier: Gitleaks
                  spec:
                    # Orchestration runs Gitleaks and ingests results in this one step.
                    # Ingestion is the other mode: you produce a results file yourself and point ingestion.file at it.
                    # Auto target detection (below) works only in orchestration.
                    mode: orchestration
                    # Predefined scanner configuration shipped with the step. Leave default unless you have a reason to change it.
                    config: default
                    target:
                      # Repository = scan the cloned source. Not a container image.
                      type: repository
                      # Auto fills target and variant from the clone. Leave name and variant unset.
                      # Target  = git config --get remote.origin.url
                      # Variant = git rev-parse --abbrev-ref HEAD (the branch that was cloned)
                      # You are not prompted for these at Run.
                      detection: auto
                      # Manual alternative (do not combine with detection: auto):
                      # name: my-repo
                      # variant: main
                      # Optional. Default workspace is /harness (the clone).
                      # Set this only to scan a subdirectory or one file, for example /harness/tmp/artifacts.
                      # workspace: /harness
                    advanced:
                      log:
                        # Minimum log severity: debug, info, warning, or error.
                        level: info
                      # Optional. Uncomment to fail the build when a finding is at or above this severity.
                      # Values: critical, high, medium, low, info, none.
                      # none records findings and does not fail the build. Omit the key to leave the gate unset.
                      # fail_on_severity: high
                    # Optional CLI flags. Uncomment to redact secrets in the log, or to limit history.
                    # --redact hides secret values in the step log.
                    # --log-opts="-n 1000" scans only the last 1000 commits. Default is the full history.
                    # settings:
                    #   tool_args: "--redact --log-opts=\"-n 1000\""
